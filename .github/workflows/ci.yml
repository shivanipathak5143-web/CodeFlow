name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPO: repolens

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC (remove after fixing)
        env:
          ROLE: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          echo "role secret length: ${#ROLE} (expected 53)"
          python3 - <<'EOF'
          import os, json, base64, urllib.request
          req = urllib.request.Request(
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com",
              headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          tok = json.load(urllib.request.urlopen(req))["value"]
          p = tok.split(".")[1]
          p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          print({k: c[k] for k in ("sub", "aud", "iss")})
          EOF

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          echo "IMAGE_URI=$IMAGE:${{ github.sha }}" >> $GITHUB_ENV

      - name: Deploy to EC2 via SSM
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name AWS-RunShellScript \
            --parameters "commands=[\"/opt/repolens/deploy.sh $IMAGE_URI\"]" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id $CMD_ID --instance-id ${{ secrets.EC2_INSTANCE_ID }} || true
          aws ssm get-command-invocation --command-id $CMD_ID --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query '[Status, StandardOutputContent, StandardErrorContent]' --output text
          STATUS=$(aws ssm get-command-invocation --command-id $CMD_ID \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} --query Status --output text)
          [ "$STATUS" = "Success" ]