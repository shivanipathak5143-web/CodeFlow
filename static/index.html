<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RepoLens</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --mut:#666; --bd:#d8d8d8; --card:#f6f6f6; --acc:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181d; --fg:#e8e8e8; --mut:#9aa; --bd:#333; --card:#1f2229; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:12px 16px; border-bottom:1px solid var(--bd); display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  header h1 { font-size:18px; margin:0 12px 0 0; }
  input, textarea, select { background:var(--card); color:var(--fg); border:1px solid var(--bd); border-radius:6px; padding:6px 8px; font:inherit; }
  button { background:var(--acc); color:#fff; border:0; border-radius:6px; padding:6px 12px; cursor:pointer; font:inherit; }
  button.alt { background:var(--card); color:var(--fg); border:1px solid var(--bd); }
  button.tab.on { background:var(--acc); color:#fff; }
  #url { flex:1; min-width:260px; }
  main { display:grid; grid-template-columns: 1fr 380px; gap:12px; padding:12px 16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel { border:1px solid var(--bd); border-radius:8px; padding:12px; background:var(--card); min-height:200px; }
  #tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  #diagram { overflow:auto; background:#fff; border-radius:6px; padding:8px; color:#000; min-height:240px; }
  #diagram svg { max-width:100%; height:auto; }
  .row { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; align-items:center; }
  pre { background:var(--bg); border:1px solid var(--bd); border-radius:6px; padding:8px; overflow:auto; max-height:320px; font-size:12px; }
  .mut { color:var(--mut); } .err { color:#d33; }
  #list li { margin:6px 0; cursor:pointer; } #list li b { color:var(--acc); }
  h3 { margin:10px 0 4px; font-size:14px; }
</style>
</head>
<body>
<header>
  <h1>RepoLens</h1>
  <input id="url" placeholder="https://github.com/owner/repo">
  <button id="go">Analyze</button>
  <span id="status" class="mut"></span>
</header>
<main>
  <section>
    <div id="tabs">
      <button class="tab alt on" data-tab="arch">Architecture</button>
      <button class="tab alt" data-tab="modules">Modules (ML)</button>
      <button class="tab alt" data-tab="roles">File roles (ML)</button>
      <button class="tab alt" data-tab="ml">ML pipeline</button>
      <button class="tab alt" data-tab="order">Reading order</button>
      <button class="tab alt" data-tab="search">Search</button>
      <button class="tab alt" data-tab="trace">Data flow</button>
      <button class="tab alt" data-tab="pr">PR impact</button>
      <button class="alt" id="explain">Explain this repo</button>
    </div>
    <div id="controls"></div>
    <div id="list" class="panel" style="display:none"></div>
    <div id="diagram" class="panel"><span class="mut">Paste a public GitHub URL and press Analyze.</span></div>
    <div class="row">
      <button class="alt" id="copyMmd">Copy Mermaid</button>
      <button class="alt" id="dlMmd">Download .mmd</button>
      <button class="alt" id="dlPng">Download PNG</button>
      <button class="alt" id="copyReadme">Copy README section</button>
    </div>
    <div id="explainOut" class="mut"></div>
  </section>
  <aside class="panel" id="side"><span class="mut">Click any node in a diagram to inspect that file.</span></aside>
</main>
<script>
mermaid.initialize({ startOnLoad:false, securityLevel:'loose', flowchart:{ htmlLabels:false, useMaxWidth:true } });
const $ = s => document.querySelector(s);
const state = { url:'', data:null, idmap:{}, code:'', tab:'arch', path:'' };
let counter = 0;

async function api(path, body) {
  const r = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}
const status = (t, err) => { const s = $('#status'); s.textContent = t; s.className = err ? 'err' : 'mut'; };

async function draw(code) {
  state.code = code;
  const box = $('#diagram'); $('#list').style.display = 'none'; box.style.display = '';
  if (!code) { box.innerHTML = '<span class="mut">Nothing to show for this view.</span>'; return; }
  try {
    const { svg, bindFunctions } = await mermaid.render('m' + (++counter), code);
    box.innerHTML = svg; if (bindFunctions) bindFunctions(box);
  } catch (e) { box.textContent = 'Diagram error: ' + e.message; }
}

window.showFile = id => openFile(state.idmap[id] || id);

async function analyze() {
  state.url = $('#url').value.trim(); if (!state.url) return;
  status('Cloning and analysing…');
  try {
    const d = await api('/api/analyze', { url: state.url });
    state.data = d; state.idmap = d.idmap;
    status(`${d.stats.files} files · ${d.stats.edges} imports · ${d.stats.functions} functions · commit ${d.commit}`);
    setTab('arch');
  } catch (e) { status(e.message, true); }
}

function setTab(t) {
  state.tab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  const c = $('#controls'); c.innerHTML = ''; if (!state.data) return;
  if (t === 'arch') draw(state.data.mermaid);
  else if (t === 'ml') draw(state.data.ml_mermaid);
  else if (t === 'order') showOrder();
  else if (t === 'modules') showModules();
  else if (t === 'roles') showRoles();
  else if (t === 'search') {
    c.innerHTML = '<div class="row"><input id="sQ" size="44" placeholder="e.g. where is the login logic"><button id="sGo">Search</button></div>';
    const run = async () => {
      try {
        const r = await api('/api/search', { url:state.url, query:$('#sQ').value });
        showList('Search results', r.results.map(x => ({ title:x.path, sub:`score ${x.score}` + (x.functions.length ? ' · functions: ' + x.functions.join(', ') : ''), path:x.path })));
      } catch (e) { status(e.message, true); }
    };
    $('#sGo').onclick = run; $('#sQ').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
    draw('');
  }
  else if (t === 'trace') {
    c.innerHTML = '<div class="row"><input id="tTarget" placeholder="target keyword e.g. db, save, model"><input id="tStart" placeholder="start (optional, default: HTTP routes)"><button id="tGo">Trace</button></div>';
    $('#tGo').onclick = async () => {
      try { const r = await api('/api/trace', { url:state.url, target:$('#tTarget').value, start:$('#tStart').value || null }); draw(r.mermaid); status('Trace found'); }
      catch (e) { status(e.message, true); }
    };
    draw('');
  } else if (t === 'pr') {
    c.innerHTML = '<div class="row"><input id="prUrl" size="44" placeholder="https://github.com/owner/repo/pull/123"><button id="prGo">Analyse PR</button></div><textarea id="prDiff" rows="3" style="width:100%" placeholder="…or paste a unified diff here"></textarea>';
    $('#prGo').onclick = async () => {
      try {
        const r = await api('/api/diff', { url:state.url, pr_url:$('#prUrl').value || null, diff:$('#prDiff').value || null });
        state.idmap = r.idmap; draw(r.mermaid);
        status(`${r.changed.length} changed (red), ${Object.keys(r.affected).length} affected (orange)`);
      } catch (e) { status(e.message, true); }
    };
    draw('');
  }
}

function showList(title, items, note) {
  $('#diagram').style.display = 'none';
  const l = $('#list'); l.style.display = ''; l.innerHTML = '';
  const h = document.createElement('h3'); h.textContent = title; l.append(h);
  if (note) { const n = document.createElement('div'); n.className = 'mut'; n.textContent = note; l.append(n); }
  const ol = document.createElement('ol'); l.append(ol);
  items.forEach(o => {
    const li = document.createElement('li');
    const b = document.createElement('b'); b.textContent = o.title;
    const sub = document.createElement('div'); sub.className = 'mut'; sub.textContent = o.sub || '';
    li.append(b, sub); li.onclick = () => openFile(o.path); ol.append(li);
  });
  if (!items.length) { const e = document.createElement('div'); e.className = 'mut'; e.textContent = 'Nothing found.'; l.append(e); }
}

function showOrder() {
  showList('Read these files in this order',
    state.data.onboarding.map(o => ({ title:o.path, sub:o.reason, path:o.path })));
}

async function showRoles() {
  try {
    const r = await api('/api/roles', { url:state.url });
    const note = r.source === 'model'
      ? 'Predicted by your trained scikit-learn model (confidence in brackets). Low confidence shows as "other".'
      : 'No trained model found, so these come from keyword rules. Train one with the ml/ scripts to use ML.';
    showList('File roles', r.roles.map(x => ({ title:`${x.role}: ${x.path}`, sub:`confidence ${x.confidence} · keyword rule says: ${x.rule}`, path:x.path })), note);
  } catch (e) { status(e.message, true); }
}

async function showModules() {
  try {
    const r = await api('/api/modules', { url:state.url });
    state.idmap = r.idmap; draw(r.mermaid);
    status(`${r.k} modules found by clustering · silhouette ${r.silhouette} · agreement with folders (NMI) ${r.nmi}`);
  } catch (e) { status(e.message, true); }
}

async function openFile(path) {
  state.path = path; const side = $('#side'); side.textContent = 'Loading…';
  try {
    const f = await api('/api/file', { url:state.url, path });
    side.innerHTML = '';
    const add = (tag, text, cls) => { const e = document.createElement(tag); e.textContent = text; if (cls) e.className = cls; side.append(e); return e; };
    add('h3', f.path); add('div', `${f.lang} · ${f.loc} lines`, 'mut');
    const sum = add('div', '', 'mut');
    const sb = document.createElement('button'); sb.textContent = 'Explain this file'; sb.className = 'alt';
    sb.onclick = async () => { sum.textContent = 'Thinking…'; try { sum.textContent = (await api('/api/file_summary', { url:state.url, path })).summary; } catch (e) { sum.textContent = e.message; } };
    side.append(sb);
    if (f.routes.length) add('div', 'Routes: ' + f.routes.map(r => r[1]).join(', '));
    add('h3', 'Imports'); add('div', f.imports.join(', ') || 'none from this repo', 'mut');
    add('h3', 'Imported by'); add('div', f.imported_by.join(', ') || 'nobody', 'mut');
    if (f.functions.length) {
      add('h3', 'Function flowchart');
      const row = document.createElement('div'); row.className = 'row';
      const sel = document.createElement('select'); f.functions.forEach(n => sel.add(new Option(n, n)));
      const fb = document.createElement('button'); fb.textContent = 'Draw';
      fb.onclick = async () => { try { const r = await api('/api/flowchart', { url:state.url, path, function:sel.value }); draw(r.mermaid); } catch (e) { status(e.message, true); } };
      row.append(sel, fb); side.append(row);
    }
    add('h3', 'Code'); const pre = add('pre', f.code);
  } catch (e) { side.textContent = e.message; }
}

$('#explain').onclick = async () => {
  const o = $('#explainOut'); o.textContent = 'Summarising the most important files…';
  try { o.textContent = (await api('/api/summary', { url:state.url })).summary; } catch (e) { o.textContent = e.message; }
};

function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); URL.revokeObjectURL(a.href); }
$('#copyMmd').onclick = () => navigator.clipboard.writeText(state.code);
$('#dlMmd').onclick = () => download(new Blob([state.code], { type:'text/plain' }), 'diagram.mmd');
$('#copyReadme').onclick = () => navigator.clipboard.writeText('## Architecture\n\n```mermaid\n' + state.code.split('\n').filter(l => !l.trim().startsWith('click ')).join('\n') + '\n```\n');
$('#dlPng').onclick = () => {
  const svg = $('#diagram svg'); if (!svg) return;
  const r = svg.getBoundingClientRect(), c = svg.cloneNode(true);
  c.setAttribute('width', r.width); c.setAttribute('height', r.height);
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas'); cv.width = r.width * 2; cv.height = r.height * 2;
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height); cv.toBlob(b => download(b, 'diagram.png'));
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(c));
};
$('#go').onclick = analyze;
$('#url').addEventListener('keydown', e => { if (e.key === 'Enter') analyze(); });
document.querySelectorAll('.tab').forEach(b => b.onclick = () => setTab(b.dataset.tab));
</script>
</body>
</html>
